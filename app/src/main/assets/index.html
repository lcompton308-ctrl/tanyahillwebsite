<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colour Profile</title>
<style>
@font-face{font-family:'Bebas Neue';src:url('fonts/BebasNeue-Regular.ttf') format('truetype');font-display:swap;}
@font-face{font-family:'DM Sans';src:url('fonts/DMSans.ttf') format('truetype');font-weight:100 1000;font-display:swap;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:#0a0a0a;}
body{font-family:'DM Sans',sans-serif;color:#f5f2ec;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);-webkit-user-select:none;user-select:none;}
.hdr{background:#0a0a0a;border-bottom:3px solid #C9962A;padding:16px 22px;}
.logo-name{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:3px;color:#C9962A;display:block;}
.logo-row{display:flex;align-items:center;gap:7px;font-size:0.57rem;letter-spacing:5px;text-transform:uppercase;color:#666;margin:2px 0 3px;}
.logo-line{height:1px;width:16px;background:#8B6914;display:inline-block;}
.logo-sub{font-family:'Bebas Neue',sans-serif;font-size:0.82rem;letter-spacing:4px;color:#8B6914;}
.hero{text-align:center;padding:36px 20px 24px;background:linear-gradient(180deg,#111 0%,#0a0a0a 100%);}
.hero h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(1.8rem,6vw,3.4rem);letter-spacing:3px;line-height:1.05;}
.hero h1 span{color:#C9962A;}
.hero p{margin:10px auto 0;color:#999;font-size:0.87rem;max-width:460px;line-height:1.65;}
.prog-wrap{max-width:480px;margin:18px auto 0;background:#222;border-radius:99px;height:5px;overflow:hidden;}
.prog-bar{height:100%;background:linear-gradient(90deg,#C9962A,#e8b84b);border-radius:99px;transition:width 0.4s ease;}
.prog-label{text-align:center;font-size:0.63rem;color:#555;letter-spacing:1px;text-transform:uppercase;margin:5px auto 0;}
.scr{padding:22px 17px 56px;max-width:640px;margin:0 auto;animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:22px;}
.card{border-radius:10px;padding:14px 13px;border-left:5px solid;}
.card-lbl{font-family:'Bebas Neue',sans-serif;font-size:0.93rem;letter-spacing:2px;margin-bottom:4px;}
.card p{font-size:0.76rem;line-height:1.55;color:#333;}
.btn-start{display:block;margin:24px auto 0;background:#C9962A;color:#0a0a0a;font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:3px;border:none;padding:14px 44px;border-radius:8px;cursor:pointer;}
.btn-start:active{background:#e8b84b;}
.q-count{font-size:0.64rem;letter-spacing:3px;text-transform:uppercase;color:#C9962A;margin-bottom:8px;}
.q-text{font-size:1.08rem;font-weight:600;line-height:1.55;color:#D4A843;margin-bottom:20px;}
.opt{display:block;width:100%;background:#1a1a1a;border:2px solid #2e2e2e;border-radius:10px;padding:13px 15px;color:#D4A843;font-family:'DM Sans',sans-serif;font-size:0.89rem;text-align:left;cursor:pointer;line-height:1.5;margin-bottom:9px;transition:all 0.18s;}
.opt.sel{border-color:#C9962A;background:#1e1800;color:#e8b84b;}
.sec{background:#111;border:1px solid #1e1e1e;border-radius:12px;padding:19px;margin-bottom:16px;}
.sec-t{font-family:'Bebas Neue',sans-serif;font-size:1.08rem;letter-spacing:2px;color:#C9962A;margin-bottom:12px;}
.banner{text-align:center;padding:22px 16px;border-radius:12px;margin-bottom:16px;}
.ban-lbl{font-family:'Bebas Neue',sans-serif;font-size:0.7rem;letter-spacing:4px;margin-bottom:3px;}
.ban-type{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:3px;color:#111;line-height:1;}
.ban-tag{font-size:0.79rem;color:#444;margin-top:4px;}
.summary{font-size:0.84rem;color:#ccc;line-height:1.7;}
.second{font-size:0.78rem;color:#666;margin-top:10px;}
.score-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.s-lbl{font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:0.8rem;width:54px;flex-shrink:0;}
.s-track{flex:1;height:7px;background:#222;border-radius:99px;overflow:hidden;}
.s-fill{height:100%;width:0;border-radius:99px;transition:width 1s ease;}
.s-pct{font-size:0.73rem;color:#777;width:34px;text-align:right;flex-shrink:0;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.item{font-size:0.81rem;line-height:1.6;margin-bottom:5px;}
.item-icon{margin-right:5px;}
.tip-row{display:flex;gap:11px;margin-bottom:14px;align-items:flex-start;}
.tip-num{width:28px;height:28px;border-radius:50%;background:#C9962A;color:#0a0a0a;font-weight:700;font-size:0.79rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.tip-title{font-size:0.88rem;font-weight:600;color:#f5f2ec;margin-bottom:3px;}
.tip-text{font-size:0.81rem;color:#bbb;line-height:1.65;}
.working-box{background:#0d0d0d;border-left:4px solid #C9962A;border-radius:0 8px 8px 0;padding:14px 16px;font-size:0.82rem;color:#ccc;line-height:1.7;}
.working-label{font-family:'Bebas Neue',sans-serif;font-size:0.78rem;letter-spacing:2px;color:#C9962A;margin-bottom:6px;}
.brand-block{text-align:center;padding:16px;background:#111;border:1px solid #1e1e1e;border-radius:12px;margin-bottom:16px;}
.brand-sm{font-size:0.63rem;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:4px;}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:3px;color:#C9962A;}
.brand-tel{font-size:0.67rem;color:#555;margin-top:3px;letter-spacing:1px;}
.brand-tel a,.footer a{color:inherit;text-decoration:none;}
.btn-re{display:block;margin:0 auto;background:transparent;color:#C9962A;border:2px solid #8B6914;font-family:'Bebas Neue',sans-serif;font-size:0.95rem;letter-spacing:3px;padding:12px 32px;border-radius:8px;cursor:pointer;}
.footer{text-align:center;padding:20px;border-top:1px solid #1a1a1a;font-size:0.63rem;color:#444;letter-spacing:2px;text-transform:uppercase;}
.footer span{color:#C9962A;}
@media(max-width:480px){.intro-grid,.two-col{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="hdr">
  <span class="logo-name">Tanya Hill</span>
  <div class="logo-row"><span class="logo-line"></span>Coaching<span class="logo-line"></span></div>
  <span class="logo-sub">Built Like a Boss</span>
</div>

<div class="hero">
  <h1>Behaviour <span>Colour</span><br>Profile</h1>
  <p>Based on Thomas Erikson's <em>Surrounded by Idiots</em> — answer 12 questions to discover your natural colour and what it means for how you work.</p>
  <div id="prog" hidden>
    <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
    <div class="prog-label" id="progLabel"></div>
  </div>
</div>

<main id="app"></main>

<div class="footer">
  <span>Tanya Hill Coaching</span> · Built Like a Boss · <a href="tel:07714541600">07714541600</a> · Clarity. Confidence. Action. Results.
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
