name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download fonts (Bebas Neue and DM Sans, free Google fonts)
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -sSfL -o app/src/main/assets/fonts/BebasNeue-Regular.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/bebasneue/BebasNeue-Regular.ttf"
          curl -sSfL -o app/src/main/assets/fonts/DMSans.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/dmsans/DMSans%5Bopsz,wght%5D.ttf"

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ColourProfile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ColourProfile-apk
          path: ColourProfile.apk

      - name: Publish to Releases (easy phone download)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Colour Profile build ${{ github.run_number }}
          files: ColourProfile.apk
          make_latest: true
