name: Publish website

on:
  push:
    branches: [ main ]
    paths: [ "site/**", ".github/workflows/website.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Add web fonts (Poppins and DM Sans, open-source Google fonts, self-hosted)
        run: |
          pip install --quiet fonttools brotli
          mkdir -p /tmp/f site/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -sSfL -o /tmp/f/p700.ttf "$base/poppins/Poppins-Bold.ttf"
          curl -sSfL -o /tmp/f/p600.ttf "$base/poppins/Poppins-SemiBold.ttf"
          curl -sSfL -o /tmp/f/dm.ttf "$base/dmsans/DMSans%5Bopsz,wght%5D.ttf"
          curl -sSfL -o /tmp/f/dmi.ttf "$base/dmsans/DMSans-Italic%5Bopsz,wght%5D.ttf"
          U="U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+2713,U+2715"
          pyftsubset /tmp/f/p700.ttf --unicodes="$U" --layout-features='*' --flavor=woff2 --output-file=site/fonts/poppins-700.woff2
          pyftsubset /tmp/f/p600.ttf --unicodes="$U" --layout-features='*' --flavor=woff2 --output-file=site/fonts/poppins-600.woff2
          pyftsubset /tmp/f/dm.ttf  --unicodes="$U" --layout-features='*' --flavor=woff2 --output-file=site/fonts/dmsans.woff2
          pyftsubset /tmp/f/dmi.ttf --unicodes="$U" --layout-features='*' --flavor=woff2 --output-file=site/fonts/dmsans-italic.woff2
          ls -la site/fonts

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
